[project]
name = "enterprise-playwright-python"
version = "0.1.0"
description = "Enterprise Playwright and pytest-bdd automation platform"
requires-python = ">=3.11"
dependencies = [
  "allure-pytest>=2.13,<3",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "playwright>=1.48,<2",
  "pytest>=9.0.3,<10",
  "pytest-bdd>=8.1,<9",
  "pytest-xdist>=3.6,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<25",
  "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=4.0,<5",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "features"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "app1: Cricbuzz scenarios",
  "app2: Google scenarios",
  "smoke: smoke suite",
  "sanity: sanity suite",
  "regression: regression suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
