name: scheduled-suites

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 4 * * *'
    - cron: '0 6 * * *'
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      application:
        description: Application to run manually
        required: true
        default: app1
        type: choice
        options: [app1, app2]
      environment:
        description: Environment to run manually
        required: true
        default: UAT
        type: choice
        options: [QA, UAT]
      suite:
        description: Suite to run manually
        required: true
        default: sanity
        type: choice
        options: [smoke, sanity, regression, e2e]
      browser:
        description: Browser to run manually
        required: true
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

jobs:
  suite:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && matrix.application == inputs.application && matrix.browser == inputs.browser) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        application: [app1, app2]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: Run scheduled suite
        env:
          APP: ${{ inputs.application || matrix.application }}
          ENVIRONMENT: ${{ inputs.environment || 'UAT' }}
          SELECTED_SUITE: ${{ inputs.suite || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          BROWSER: ${{ inputs.browser || matrix.browser }}
          WORKERS: '6'
          RUN_BROWSER_TESTS: 'true'
        run: |
          suite="$SELECTED_SUITE"
          if [ -z "$suite" ]; then
            case "$SCHEDULE" in
              '0 2 * * *') suite='sanity' ;;
              '0 4 * * *') suite='smoke' ;;
              '0 6 * * *') suite='regression' ;;
              '0 8 * * 0') suite='e2e' ;;
              *) echo "Unsupported schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi
          pytest -n 6 -m "$APP and $suite" --junitxml="reports/$APP-$BROWSER.xml" --html="reports/$APP-$BROWSER.html" --self-contained-html --alluredir=reports/allure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-${{ matrix.application }}-${{ matrix.browser }}
          path: reports/
          retention-days: 30