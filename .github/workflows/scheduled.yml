name: scheduled-suites

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 4 * * *'
    - cron: '0 6 * * *'
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        application: [app1, app2]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: Run scheduled suite
        env:
          APP: ${{ matrix.application }}
          ENVIRONMENT: UAT
          SUITE: ${{ github.event.schedule == '0 2 * * *' && 'sanity' || github.event.schedule == '0 4 * * *' && 'smoke' || github.event.schedule == '0 6 * * *' && 'regression' || 'e2e' }}
          BROWSER: ${{ matrix.browser }}
          RUN_BROWSER_TESTS: 'true'
        run: python -m pytest tests/e2e -m "${{ matrix.application }} and ${{ github.event.schedule == '0 2 * * *' && 'sanity' || github.event.schedule == '0 4 * * *' && 'smoke' || github.event.schedule == '0 6 * * *' && 'regression' || 'e2e' }}" --junitxml=reports/${{ matrix.application }}-${{ matrix.browser }}.xml --html=reports/${{ matrix.application }}-${{ matrix.browser }}.html --self-contained-html --alluredir=reports/allure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-${{ matrix.application }}-${{ matrix.browser }}
          path: reports/
          retention-days: 30