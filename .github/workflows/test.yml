name: test

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application manifest name
        required: true
        default: app1
        type: choice
        options: [app1, app2]
      environment:
        description: Target environment
        required: true
        default: UAT
        type: choice
        options: [QA, UAT]
      suite:
        description: Suite marker
        required: true
        default: regression
        type: choice
        options: [smoke, sanity, regression, e2e]
      browser:
        description: Playwright browser
        required: true
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]
      workers:
        description: Pytest worker count
        required: true
        default: '1'
        type: string
  push:
    branches: [main]

jobs:
  framework:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: playwright install --with-deps ${{ inputs.browser || matrix.browser }}
      - name: Framework tests
        run: python -m pytest tests/unit tests/architecture --cov=src --cov-report=term-missing --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html --alluredir=reports/allure
      - name: Browser tests
        env:
          APP: ${{ inputs.application || 'app1' }}
          ENVIRONMENT: ${{ inputs.environment || 'UAT' }}
          SUITE: ${{ inputs.suite || 'smoke' }}
          BROWSER: ${{ inputs.browser || matrix.browser }}
          WORKERS: ${{ inputs.workers || '1' }}
          RUN_BROWSER_TESTS: 'true'
        run: python -m pytest tests/e2e -n "${{ inputs.workers || '1' }}" -m "${{ inputs.application || 'app1' }} and ${{ inputs.suite || 'smoke' }}" --junitxml=reports/e2e-${{ inputs.browser || matrix.browser }}.xml --html=reports/e2e-${{ inputs.browser || matrix.browser }}.html --self-contained-html --alluredir=reports/allure
      - run: ruff check .
      - run: pip-audit -r requirements.lock --format cyclonedx-json --output reports/sbom.json
      - run: bandit -r src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.browser }}
          path: reports/
          retention-days: 30
