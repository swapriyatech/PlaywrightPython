name: Manual Test Execution

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application to test
        required: true
        default: app1
        type: choice
        options:
          - app1
          - app2
      environment:
        description: Target environment
        required: true
        default: UAT
        type: choice
        options:
          - QA
          - UAT
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - e2e
      browser:
        description: Browser
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      parallel:
        description: Enable parallel execution
        required: true
        default: true
        type: boolean
      workers:
        description: Number of parallel workers
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '6'
          - '10'

permissions:
  contents: read

jobs:
  manual-test:
    name: ${{ inputs.application }} / ${{ inputs.suite }} / ${{ inputs.browser }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: playwright install --with-deps ${{ inputs.browser }}
      - name: Run framework tests
        run: python -m pytest tests/unit tests/architecture --junitxml=reports/framework.xml --html=reports/framework.html --self-contained-html
      - name: Run selected browser suite
        env:
          APP: ${{ inputs.application }}
          ENVIRONMENT: ${{ inputs.environment }}
          SUITE: ${{ inputs.suite }}
          BROWSER: ${{ inputs.browser }}
          WORKERS: ${{ inputs.workers }}
          RUN_BROWSER_TESTS: 'true'
        run: |
          if [ "${{ inputs.parallel }}" = "true" ]; then
            python -m pytest tests/e2e -n "${{ inputs.workers }}" -m "${{ inputs.application }} and ${{ inputs.suite }}" --junitxml=reports/e2e.xml --html=reports/e2e.html --self-contained-html --alluredir=reports/allure
          else
            python -m pytest tests/e2e -m "${{ inputs.application }} and ${{ inputs.suite }}" --junitxml=reports/e2e.xml --html=reports/e2e.html --self-contained-html --alluredir=reports/allure
          fi
      - name: Quality and security checks
        run: |
          ruff check .
          pip-audit -r requirements.lock
          bandit -r src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-test-reports
          path: reports/
          retention-days: 30
